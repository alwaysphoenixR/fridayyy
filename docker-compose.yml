version: "3.8"

services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: second_brain_qdrant
    ports:
      - "6333:6333" # REST API port (What Express uses)
      - "6334:6334" # gRPC port (For high-speed internal comms if needed)
    volumes:
      - ./qdrant_storage:/qdrant/storage
    environment:
      # Optional: Helps if you ever want to hit the DB directly from your React frontend
      - QDRANT__SERVICE__ENABLE_CORS=true
